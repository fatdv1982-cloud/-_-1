jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SnakeGame   # Замените на фактическое имя подкаталога

    steps:
    # ... остальные шаги ...
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Новый шаг: установка Gradle и генерация wrapper
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    # Теперь gradlew существует, можно продолжать
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradle

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: snake-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
